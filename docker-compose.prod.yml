version: "3.9"

# ===================================================
# InfraSmart - 프로덕션 Docker Compose
# 사용법: docker compose -f docker-compose.prod.yml up -d
# ===================================================

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: infrasmart_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 프로덕션: 포트 외부 미노출 (내부 네트워크만 사용)

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: infrasmart_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 프로덕션: 포트 외부 미노출

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrasmart_api
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --reload 없음 (프로덕션 모드)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 75

  # ── Nginx (리버스 프록시 + SSL) ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: infrasmart_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - api

  # ── Certbot (SSL 자동 갱신) ───────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: infrasmart_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # 12시간마다 인증서 자동 갱신 시도
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_certs:
  certbot_webroot:
