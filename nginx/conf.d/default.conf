# ===================================================
# InfraSmart - Nginx 설정
# STEP 1: 도메인 설정 전 HTTP only (SSL 발급용)
# STEP 2: SSL 발급 후 아래 HTTPS 블록 주석 해제
# ===================================================

# ── STEP 1: HTTP (Let's Encrypt 챌린지 + API 프록시) ──────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt 인증서 발급용 (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP → HTTPS 리다이렉트 (SSL 발급 후 활성화)
    # STEP 2에서 아래 주석 해제, location / 블록은 주석 처리
    # return 301 https://$host$request_uri;

    # HTTP로 직접 API 프록시 (SSL 발급 전 임시)
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 업로드 최대 크기 (PDF 등)
        client_max_body_size 100M;

        # 타임아웃 (AI OCR 처리 시간 고려)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}

